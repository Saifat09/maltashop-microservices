# CI/CD pipeline for the Order service.
#
#  commit stage      -> lint, unit, component and contract tests (minutes)
#  build stage       -> build the image ONCE, tag it with the commit SHA, scan it
#  acceptance stage  -> run that exact image with the rest of the system and
#                       drive the place-order saga end to end
#  release stages    -> (main only) publish the same image, then promote it to
#                       staging and production by digest - never rebuild.
name: order-service

on:
  push:
    branches: [main]
    paths:
      - "services/order/**"
      - "libs/chassis/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    paths:
      - "services/order/**"
      - "libs/chassis/**"
      - "contracts/**"
      - "docker-compose.yml"
      - "scripts/**"
      - ".github/workflows/order-service.yml"
  workflow_dispatch:

concurrency:
  group: order-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LOCAL_IMAGE: maltashop/order-service

jobs:
  commit-stage:
    name: Lint and test (unit, component, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/order
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/order/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt ../../libs/chassis
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest tests/unit -v --junitxml=reports/unit.xml
      - name: Component tests
        run: pytest tests/component -v --junitxml=reports/component.xml
      - name: Contract tests (OrderPlaced vs consumer schemas)
        run: pytest tests/contract -v --junitxml=reports/contract.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-test-reports
          path: services/order/reports/

  build:
    name: Build image once and scan
    needs: commit-stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image tagged with commit SHA
        run: docker build -f services/order/Dockerfile -t "$LOCAL_IMAGE:${GITHUB_SHA}" .
      - name: Vulnerability scan (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$LOCAL_IMAGE:${GITHUB_SHA}"
      - name: Save image as pipeline artifact
        run: docker save "$LOCAL_IMAGE:${GITHUB_SHA}" | gzip > order-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: order-image
          path: order-image.tar.gz
          retention-days: 7

  acceptance:
    name: End-to-end saga test on the built image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: order-image
      - name: Load the image built in the previous stage
        run: gunzip -c order-image.tar.gz | docker load
      - name: Build the other services (their own pipelines own their images)
        run: docker compose build inventory-service payment-service notification-service
      - name: Start the system without rebuilding the Order image
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke test - confirm, decline (compensation) and out-of-stock paths
        run: python3 scripts/smoke_test.py
      - name: Trace one order through all services (correlation ID)
        run: bash scripts/demo.sh "ci-${GITHUB_RUN_NUMBER}"
      - name: Fault isolation - checkout keeps working while Notification is down
        run: bash scripts/isolation_test.sh "${GITHUB_RUN_NUMBER}"
      - name: Dump all logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: order-image
      - run: gunzip -c order-image.tar.gz | docker load
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag and push the tested image (no rebuild)
        id: push
        run: |
          REMOTE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maltashop-order-service:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE:${GITHUB_SHA}" "$REMOTE"
          docker push "$REMOTE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REMOTE")
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Promote to staging
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy by digest (simulated in the prototype - no cluster attached)
        run: |
          echo "Would run: kubectl -n staging set image deployment/order-service order=${{ needs.publish.outputs.image }}"
          echo "Would run: kubectl -n staging rollout status deployment/order-service --timeout=120s"
          echo "Staging: ${{ needs.publish.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Promote to production (manual approval)
    needs: [publish, deploy-staging]
    runs-on: ubuntu-latest
    # Add "Required reviewers" to the production environment in the repo settings
    # to turn this into a human release gate (continuous delivery).
    environment: production
    steps:
      - name: Deploy the same digest that passed staging (simulated)
        run: |
          echo "Would run: kubectl -n production set image deployment/order-service order=${{ needs.publish.outputs.image }}"
          echo "Production: ${{ needs.publish.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
