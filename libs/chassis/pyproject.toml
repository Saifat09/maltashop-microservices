[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maltashop-chassis"
version = "0.1.0"
description = "Thin microservice chassis shared by MaltaShop services: JSON logging, correlation IDs, outbox and messaging."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "aio-pika>=9.4",
]

[tool.setuptools.packages.find]
where = ["src"]
